name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Unit and provider contract tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/payment-reconciliation
      - name: Deterministic demo and fixture verification
        run: go run ./cmd/payment-reconciliation demo -out /tmp/demo-report
      - name: Assert fixture verification report
        run: grep -q '"passed": true' /tmp/demo-report/verification.json
